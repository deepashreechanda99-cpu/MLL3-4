<div class="wrap">

</div>

['H3K4me1','The complex lets go, but the mark stays on the nucleosome. One methyl on K4 is H3K4me1, the mark MLL3 and MLL4 write at enhancers.'],
['Readers recognise the mark','Chromatin-associated proteins, called readers, have a pocket that fits the methylated K4. They bind where the mark is and nowhere else.'],
['Remodellers are recruited','Bound readers bring in chromatin remodellers, proteins that use energy to slide nucleosomes along the DNA or remove them.'],
['The chromatin reorganises','Nucleosomes move apart and a stretch of DNA is left open. Transcription proteins can now reach the DNA at this enhancer.'],
['Focus: open, accessible DNA','With the nucleosomes moved aside, this stretch of DNA is no longer wrapped around histones. Its base sequence is exposed, so transcription proteins can bind to it.'],
['Zooming out to one gene: Gene X','This open DNA is the enhancer of a single gene, Gene X. Along the DNA come the enhancer, the promoter, and the gene itself.'],

['The transcription machinery assembles','General transcription factors gather at the promoter, next to the start of the gene, and bring in RNA polymerase.'],

['The DNA bends','DNA can fold back on itself. The enhancer is brought right up against the promoter of Gene X, forming a DNA loop.'],
['Mediator links them','Mediator is a large protein complex. It sits between the activators and the machinery at the promoter and bridges the gap.'],
['Mediator relays the message','Mediator passes the activators’ signal on to the general transcription factors and RNA polymerase, helping them start transcribing Gene X.'],
['RNA polymerase transcribes Gene X','RNA polymerase leaves the promoter and moves along Gene X. It reads the DNA and builds an RNA copy of the gene, one letter at a time.'],

const oc=document.createElement('canvas');oc.width=1800;oc.height=1040;const octx=oc.getContext('2d');let ctx=cv.getContext('2d');const mainctx=ctx;

function sceneD(T){

function draw(){
